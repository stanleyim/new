name: Night Alert (08:30 밤사이 관찰)

# 관찰용 텔레그램 1통. 읽기 전용(주문 없음), 레포에 아무것도 쓰지 않음.
# 실행: cron-job.org가 평일 08:30 KST에 workflow_dispatch로 호출. GitHub 예약(schedule)은 쓰지 않음(4~9시간 밀려 08:30 의미 없음).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Run
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python night_alert.py
