name: KIS Delisted Test (manual, read-only)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run KIS test
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          cat > t.py <<'PYEOF'
          import os, time, random, collections, requests

          BASE = "https://openapi.koreainvestment.com:9443"
          KEY, SEC = os.environ.get("KIS_APP_KEY"), os.environ.get("KIS_APP_SECRET")
          if not KEY or not SEC:
              raise SystemExit("KIS_APP_KEY / KIS_APP_SECRET 환경변수가 필요합니다")
          r = requests.post(f"{BASE}/oauth2/tokenP",
                            json={"grant_type": "client_credentials", "appkey": KEY, "appsecret": SEC}, timeout=30)
          tok = r.json().get("access_token")
          if not tok:
              raise SystemExit(f"토큰 발급 실패: {r.status_code} {r.text[:200]}")

          H = {"content-type": "application/json", "authorization": f"Bearer {tok}",
               "appkey": KEY, "appsecret": SEC, "tr_id": "CTPF1002R", "custtype": "P"}
          stat = {"calls": 0, "retry": 0}

          def info(code):
              for attempt in range(3):
                  time.sleep(0.1)
                  stat["calls"] += 1
                  try:
                      resp = requests.get(BASE + "/uapi/domestic-stock/v1/quotations/search-stock-info", headers=H,
                                          params={"PRDT_TYPE_CD": "300", "PDNO": code}, timeout=30)
                      j = resp.json()
                  except Exception as e:
                      return None, ("EXC", "", repr(e)[:60])
                  if j.get("msg_cd") == "EGW00201":
                      stat["retry"] += 1
                      time.sleep(1.0)
                      continue
                  o = j.get("output") or {}
                  if j.get("rt_cd") == "0" and o.get("prdt_abrv_name"):
                      return o, None
                  return None, (j.get("rt_cd"), j.get("msg_cd"), (j.get("msg1") or "")[:40])
              return None, ("RATE", "", "")

          def run(label, codes):
              hits, miss = [], collections.Counter()
              t0 = time.time()
              for c in codes:
                  o, err = info(c)
                  if o:
                      hits.append((c, o.get("prdt_abrv_name"), o.get("lstg_abol_dt") or "-",
                                   o.get("scts_mket_lstg_dt") or o.get("kosdaq_mket_lstg_dt") or "-"))
                  else:
                      miss[err] += 1
              dt = time.time() - t0
              print(f"[{label}] codes {len(codes)} | hits {len(hits)} | {dt:.0f}s | {len(codes)/max(dt,0.01):.1f} calls/s")
              print("   miss types:", dict(miss))
              for h in hits:
                  print("   HIT", h)

          o, _ = info("005930")
          print("KEYS", sorted(o.keys()) if o else None)
          run("known", ["005930", "117930", "037730", "036360", "038120"])
          run("seq 005000-005990", [f"{n:06d}" for n in range(5000, 6000, 10)])
          run("random", [f"{n:06d}" for n in sorted(random.Random(1).sample(range(0, 1000000, 10), 100))])
          print("total calls", stat["calls"], "rate-limit retries", stat["retry"])
          PYEOF
          python t.py
