name: KIS Delisted Test (manual, read-only)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run KIS test
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          cat > t.py <<'PYEOF'
          import os, time, collections, threading, requests
          from concurrent.futures import ThreadPoolExecutor

          BASE = "https://openapi.koreainvestment.com:9443"
          KEY, SEC = os.environ.get("KIS_APP_KEY"), os.environ.get("KIS_APP_SECRET")
          if not KEY or not SEC:
              raise SystemExit("KIS_APP_KEY / KIS_APP_SECRET 환경변수가 필요합니다")
          r = requests.post(f"{BASE}/oauth2/tokenP",
                            json={"grant_type": "client_credentials", "appkey": KEY, "appsecret": SEC}, timeout=30)
          tok = r.json().get("access_token")
          if not tok:
              raise SystemExit(f"토큰 발급 실패: {r.status_code} {r.text[:200]}")

          H = {"content-type": "application/json", "authorization": f"Bearer {tok}",
               "appkey": KEY, "appsecret": SEC, "tr_id": "CTPF1002R", "custtype": "P"}
          lock = threading.Lock()
          stat = {"retry": 0}

          def info(code):
              for attempt in range(3):
                  try:
                      resp = requests.get(BASE + "/uapi/domestic-stock/v1/quotations/search-stock-info", headers=H,
                                          params={"PRDT_TYPE_CD": "300", "PDNO": code}, timeout=30)
                      j = resp.json()
                  except Exception as e:
                      return {"rt_cd": "EXC", "msg_cd": "", "msg1": repr(e)[:60]}
                  if j.get("msg_cd") == "EGW00201":
                      with lock:
                          stat["retry"] += 1
                      time.sleep(1.0)
                      continue
                  return j
              return {"rt_cd": "RATE", "msg_cd": "", "msg1": ""}

          FIELDS = ["prdt_abrv_name", "prdt_type_cd", "scty_grp_id_cd", "idx_bztp_lcls_cd_name", "idx_bztp_mcls_cd_name",
                    "etf_dvsn_cd", "etf_type_cd", "reits_kind_cd", "kospi200_item_yn", "admn_item_yn",
                    "scts_mket_lstg_dt", "kosdaq_mket_lstg_dt", "lstg_abol_dt"]
          print("== CLASS (종류 구분 필드)")
          for code in ["005930", "005935", "000660", "035720", "247540", "069500", "117930", "553270", "997380"]:
              j = info(code)
              o = j.get("output") or {}
              print(code, "|", j.get("rt_cd"), j.get("msg_cd"), "|", {k: o.get(k) for k in FIELDS if o.get(k) not in (None, "")})
              time.sleep(0.2)

          print("== CONC (6 threads, 005000-005990)")
          codes = [f"{n:06d}" for n in range(5000, 6000, 10)]
          t0 = time.time()
          with ThreadPoolExecutor(max_workers=6) as ex:
              res = list(ex.map(info, codes))
          dt = time.time() - t0
          hits = sum(1 for j in res if j.get("rt_cd") == "0" and (j.get("output") or {}).get("prdt_abrv_name"))
          miss = collections.Counter((j.get("rt_cd"), j.get("msg_cd")) for j in res
                                     if not (j.get("rt_cd") == "0" and (j.get("output") or {}).get("prdt_abrv_name")))
          print(f"codes {len(codes)} | hits {hits} | {dt:.0f}s | {len(codes)/dt:.1f} calls/s | rate-limit retries {stat['retry']}")
          print("miss types:", dict(miss))
          print("== KIOK0530 사례 (성공 응답인데 이름 없음)")
          n = 0
          for c, j in zip(codes, res):
              if j.get("rt_cd") == "0" and not (j.get("output") or {}).get("prdt_abrv_name"):
                  o = j.get("output") or {}
                  print(c, "|", {k: v for k, v in o.items() if v not in ("", None, "0", "00000000")})
                  n += 1
                  if n >= 6:
                      break
          PYEOF
          python t.py
