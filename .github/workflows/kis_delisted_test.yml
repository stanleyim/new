name: KIS Delisted Test (manual, read-only)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run KIS delisted test
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          cat > t.py <<'PYEOF'
          # KIS로 상장폐지 종목 일봉이 조회되는지 확인하는 읽기 전용 테스트 (레포 수정 없음, 파일 저장 없음)
          # 필요: 환경변수 KIS_APP_KEY, KIS_APP_SECRET (레포 signal_runner.py 와 동일 이름)
          # 실행: python test_kis_delisted.py
          # 대상 종목: pykrx 소스 문서에 상장폐지 예시로 나온 037730(3R) 036360(3SOFT) 038120(AD모터스)
          #            + 대조군 005930(삼성전자)
          import os, time, json, requests

          BASE = "https://openapi.koreainvestment.com:9443"
          KEY, SEC = os.environ.get("KIS_APP_KEY"), os.environ.get("KIS_APP_SECRET")
          if not KEY or not SEC:
              raise SystemExit("KIS_APP_KEY / KIS_APP_SECRET 환경변수가 필요합니다")

          r = requests.post(f"{BASE}/oauth2/tokenP",
                            json={"grant_type": "client_credentials", "appkey": KEY, "appsecret": SEC}, timeout=30)
          tok = r.json().get("access_token")
          if not tok:
              raise SystemExit(f"토큰 발급 실패: {r.status_code} {r.text[:200]}")

          def daily(ticker, d1, d2):
              h = {"content-type": "application/json", "authorization": f"Bearer {tok}",
                   "appkey": KEY, "appsecret": SEC, "tr_id": "FHKST03010100"}
              p = {"FID_COND_MRKT_DIV_CODE": "J", "FID_INPUT_ISCD": ticker,
                   "FID_INPUT_DATE_1": d1, "FID_INPUT_DATE_2": d2,
                   "FID_PERIOD_DIV_CODE": "D", "FID_ORG_ADJ_PRC": "0"}
              time.sleep(0.2)
              return requests.get(f"{BASE}/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice",
                                  headers=h, params=p, timeout=30).json()

          for tk in ["037730", "036360", "038120", "005930"]:
              for end in ["20160101", "20180101", "20200101"]:
                  d = daily(tk, "20140101", end)
                  rows = [o for o in (d.get("output2") or []) if o.get("stck_bsop_date")]
                  dates = sorted(o["stck_bsop_date"] for o in rows)
                  print(tk, "end", end, "| rt_cd", d.get("rt_cd"), "| msg", d.get("msg1"),
                        "| rows", len(rows), "|", (dates[0], dates[-1]) if dates else "-")
          PYEOF
          python t.py
