name: Verify Open Recover (시가 직후 회복 확인)

# 읽기 전용, 수동 실행만. 레포에 쓰지 않음.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python verify_open_recover.py
