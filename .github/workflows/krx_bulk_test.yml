name: KRX Bulk Test (manual, read-only)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pykrx
      - name: Run KRX test
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          cat > t.py <<'PYEOF'
          import time
          from pykrx import stock

          def T(label, fn):
              t0 = time.time()
              try:
                  df = fn()
                  ok = df is not None and not df.empty
                  print(label, "|", "OK" if ok else "FAIL(빈 결과)", "| shape", getattr(df, "shape", None), "| %.1fs" % (time.time() - t0))
                  return df if ok else None
              except Exception as e:
                  print(label, "| FAIL", repr(e)[:160], "| %.1fs" % (time.time() - t0))
                  return None

          def has(df, tk):
              return (tk in df.index) if df is not None else None

          for d in ["20161229", "20150105"]:
              a = T(f"OHLCV 전종목 {d}", lambda: stock.get_market_ohlcv_by_ticker(d, market="ALL"))
              print("   한진해운(117930) 포함:", has(a, "117930"), "| 종목수:", None if a is None else len(a))
              c = T(f"시가총액 전종목 {d}", lambda: stock.get_market_cap_by_ticker(d, market="ALL"))
              print("   한진해운(117930) 포함:", has(c, "117930"), "| 컬럼:", None if c is None else list(c.columns))

          f = T("외국인 수급 전종목 20161229", lambda: stock.get_market_net_purchases_of_equities_by_ticker("20161229", "20161229", "ALL", "외국인"))
          print("   한진해운(117930) 포함:", has(f, "117930"))
          s = T("공매도 전종목 20161229", lambda: stock.get_shorting_volume_by_ticker("20161229", market="KOSPI"))
          print("   한진해운(117930) 포함:", has(s, "117930"))
          PYEOF
          python t.py
