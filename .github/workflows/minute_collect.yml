name: Minute Collect (분봉 전 종목)

# New5 분봉 전 종목 수집 (2026-10-23). 수동 시작 1회 → 끝날 때까지 10분 간격 자동 이어서 실행.
# 5분봉 = minute-data 브랜치, 1분봉 원본 = 릴리스 minute-1m (실행마다 zip 1개).
# main 브랜치에는 아무것도 커밋하지 않음.
on:
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: "테스트용 종목 수 제한 (비우면 전 종목)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: minute-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas pyarrow pykrx

      - name: Fetch existing minute-data (if any)
        run: |
          mkdir -p existing_minute_data
          if git ls-remote --exit-code --heads origin minute-data > /dev/null 2>&1; then
            git fetch --depth 1 origin minute-data
            git archive origin/minute-data -- minute_data/progress.json minute_data/krx_daily.parquet | tar -x -C existing_minute_data || true
            echo "기존 진행 상태 불러옴"
          else
            echo "minute-data 브랜치 없음 — 처음부터 시작"
          fi

      - name: Run collector (시간 예산 300분)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIME_BUDGET_MINUTES: "300"
          TEST_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit }}
        run: python -u minute_collect.py

      - name: Upload 1-minute raw to release minute-1m
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d minute1m_run ] && [ -n "$(ls -A minute1m_run 2>/dev/null)" ]; then
            name="minute1m_$(date -u +%Y%m%dT%H%M%SZ).zip"
            (cd minute1m_run && zip -q -0 -r "../$name" .)
            gh release view minute-1m > /dev/null 2>&1 || gh release create minute-1m --title "minute-1m" --notes "KIS 1분봉 원본 (종목별 parquet, 실행마다 zip 1개)" --target main
            gh release upload minute-1m "$name"
            echo "업로드: $name ($(du -h "$name" | cut -f1))"
          else
            echo "이번 실행 1분봉 없음"
          fi

      - name: Commit to minute-data branch
        if: always()
        run: |
          if [ ! -d minute_data ]; then echo "출력 없음"; exit 0; fi
          mv minute_data /tmp/minute_data
          git config user.name "github-actions[bot]"
          git config user.email "imroetaeck@gmail.com"
          if git ls-remote --exit-code --heads origin minute-data > /dev/null 2>&1; then
            git fetch origin minute-data
            git checkout -B minute-data origin/minute-data
          else
            git checkout --orphan minute-data
            git rm -rf . > /dev/null 2>&1 || true
          fi
          mkdir -p minute_data
          cp -r /tmp/minute_data/* minute_data/
          git add minute_data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -q -m "Minute collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin minute-data
          fi

      - name: Trigger next run if not complete (10분 후)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          completed=$(python3 -c "import json;print(json.load(open('/tmp/minute_data/progress.json')).get('completed', False))" 2>/dev/null || echo "False")
          lastdone=$(python3 -c "import json;print(json.load(open('/tmp/minute_data/progress.json')).get('last_run_done', 0))" 2>/dev/null || echo "0")
          echo "completed=$completed last_run_done=$lastdone"
          if [ -n "${{ github.event.inputs.ticker_limit }}" ]; then
            echo "테스트 실행 — 자동 이어서 실행 안 함"
          elif [ "$lastdone" = "0" ]; then
            echo "이번 실행 진척 0종목 — 자동 재실행 중단(텔레그램 오류 확인)"
          elif [ "$completed" != "True" ]; then
            sleep 600
            gh workflow run minute_collect.yml --ref main
          else
            echo "전 종목 완료"
          fi
