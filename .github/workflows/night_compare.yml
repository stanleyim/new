name: Night Compare (선물 밤 vs 지수 밤 vs KODEX 밤)

# 한 번씩 수동 실행. 읽기 전용(주문 없음), 레포에 아무것도 쓰지 않음. 결과는 로그와 텔레그램 1통.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pandas pykrx
      - name: Run
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python night_compare.py
