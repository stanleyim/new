name: PIT Data Collect (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pykrx pandas pyarrow
      - name: Collect ${{ matrix.year }}
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PIT_OUT: ${{ runner.temp }}/pit_out
        run: python pit_collect.py ${{ matrix.year }}
      - name: Save to pit-data branch
        if: ${{ always() }}
        env:
          PIT_OUT: ${{ runner.temp }}/pit_out
        run: |
          set +e
          ls "$PIT_OUT" 2>/dev/null || exit 0
          git config user.email "imroetaeck@gmail.com"
          git config user.name "stanleyim"
          for i in 1 2 3 4 5 6 7 8; do
            if git ls-remote --exit-code --heads origin pit-data >/dev/null 2>&1; then
              git fetch origin pit-data
              git checkout -f -B pit-data origin/pit-data
            else
              git checkout --orphan pit-data
              git rm -rf . >/dev/null 2>&1
            fi
            mkdir -p pit_data
            cp "$PIT_OUT"/* pit_data/
            git add pit_data
            git commit -m "PIT data ${{ matrix.year }}" || true
            if git push origin pit-data; then break; fi
            sleep $((RANDOM % 10 + 5))
          done
